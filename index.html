<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEBULOSA">


<title>NEBULOSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#050310;
    --bg-deep:#0a0720;
    --bg-mid:#120c2e;
    --panel:#140f2c;
    --panel-2:#1b1440;
    --line: rgba(180,170,255,0.14);
    --line-soft: rgba(180,170,255,0.08);
    --ink:#eae6ff;
    --ink-dim:#9c93c9;
    --accent:#9b8bff;
    --accent-2:#5ee6c9;
    --gold:#e8c876;
    --danger:#ff6f7d;
    --common:#8a80b8;
    --rare:#6ea8ff;
    --epic:#c48bff;
    --legend:#e8c876;
    --radius:16px;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, #241a4d 0%, transparent 55%),
      radial-gradient(ellipse 100% 60% at 85% 110%, #1a2f4a 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-void), var(--bg-deep) 40%, var(--bg-mid));
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow:hidden;
    position:fixed;
    inset:0;
  }
  #stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  #stars .layer{position:absolute; inset:0; background-repeat:repeat;}
  #app{position:relative; z-index:1; height:100%; width:100%; display:flex; flex-direction:column;}

  .screen{display:none; flex-direction:column; height:100%; width:100%; animation:fadein .35s ease;}
  .screen.active{display:flex;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  h1,h2,h3{margin:0; font-family:'Cinzel Decorative', serif;}
  .serif{font-family:'Cormorant Garamond', serif;}

  /* ---------- MENU ---------- */
  #screen-menu{align-items:center; justify-content:center; text-align:center; padding:24px; gap:10px;}
  .menu-title{font-size:2.6rem; font-weight:900; letter-spacing:1px;
    background:linear-gradient(135deg,#fff 0%, var(--accent) 45%, var(--accent-2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(155,139,255,0.35);
  }
  .menu-tag{color:var(--ink-dim); font-family:'Cormorant Garamond', serif; font-style:italic; font-size:1.15rem; max-width:340px; margin-top:2px;}
  .menu-orb{width:150px; height:150px; border-radius:50%; margin:18px 0;
    background: radial-gradient(circle at 35% 30%, #cfc4ff, #6a55d6 40%, #241a54 75%, #0a0720 100%);
    box-shadow: 0 0 70px rgba(155,139,255,0.45), inset -10px -14px 40px rgba(0,0,0,0.5), inset 8px 10px 30px rgba(255,255,255,0.15);
    animation: floaty 5s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(0px) rotate(0deg);} 50%{transform:translateY(-10px) rotate(3deg);}}
  .menu-btns{display:flex; flex-direction:column; gap:12px; margin-top:16px; width:100%; max-width:300px;}
  button{font-family:'Inter',sans-serif; cursor:pointer; border:none;}
  .btn{
    padding:15px 20px; border-radius:14px; font-size:1rem; font-weight:600;
    background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
    transition:transform .12s ease, background .2s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), #6f5ce8);
    box-shadow:0 6px 24px rgba(139,116,255,0.35);
    color:#0b0620;
  }
  .btn-ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line-soft);}
  .btn-gold{background:linear-gradient(135deg, var(--gold), #c99a4a); color:#241505;}
  .menu-footer{position:absolute; bottom:14px; color:var(--ink-dim); font-size:0.72rem; opacity:0.5; letter-spacing:0.5px;}

  /* ---------- DECKBUILDER ---------- */
  #screen-deck{padding:14px 14px 0; height:100%;}
  .deck-header{display:flex; align-items:center; justify-content:space-between; padding:4px 4px 10px;}
  .deck-header h2{font-size:1.25rem; color:var(--ink);}
  .deck-count{font-family:'Inter'; font-weight:700; font-size:0.95rem; padding:6px 12px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line);}
  .deck-count.full{color:var(--accent-2); border-color:var(--accent-2);}
  .deck-grid{flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding-bottom:14px; -webkit-overflow-scrolling:touch;}
  .deck-footer{display:flex; gap:10px; padding:12px 4px; border-top:1px solid var(--line-soft);}
  .deck-footer .btn{flex:1;}

  /* ---------- CARD ---------- */
  .card{
    position:relative; border-radius:12px; overflow:hidden; aspect-ratio:5/7;
    background:#000; border:1.5px solid var(--common);
    box-shadow:0 4px 14px rgba(0,0,0,0.5);
    display:flex; flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease, filter .15s ease;
  }
  .card.tier-rare{border-color:var(--rare);}
  .card.tier-epic{border-color:var(--epic);}
  .card.tier-legend{border-color:var(--legend); box-shadow:0 0 18px rgba(232,200,118,0.35);}
  .card .card-art{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; object-position:top center;}
  .card .card-shade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(4,2,14,0.92) 92%);}
  .card .gem{
    position:absolute; top:5px; left:5px; width:23px; height:23px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #bfe8ff, #2f6fe0 55%, #0c2a66);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:0.74rem; color:#fff; border:1px solid rgba(255,255,255,0.5);
    box-shadow:0 2px 6px rgba(0,0,0,0.5);
    z-index:2;
  }
  .card .gem.atk{
    left:5px; top:auto; bottom:5px;
    background:radial-gradient(circle at 35% 30%, #ffe6b0, #e0862f 55%, #6b2e0c);
  }
  .card .gem.hp{
    left:auto; right:5px; top:auto; bottom:5px;
    background:radial-gradient(circle at 35% 30%, #ffb0b0, #d43535 55%, #5c0c0c);
  }
  .card .taunt-badge{
    position:absolute; top:5px; right:5px; z-index:2; width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d9d0ff, #6a55d6 60%, #241a54);
    border:1px solid rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center;
    font-size:0.62rem; font-weight:800; color:#fff;
  }
  .card .name{
    position:absolute; bottom:4px; left:6px; right:6px; z-index:2;
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:0.72rem; line-height:1.05;
    color:#fdfcff; text-shadow:0 1px 3px rgba(0,0,0,0.8);
  }
  .card.selected{transform:translateY(-10px) scale(1.04); box-shadow:0 0 0 3px var(--accent-2), 0 10px 30px rgba(94,230,201,0.35);}
  .card.attacker-selected{transform:translateY(-8px) scale(1.05); box-shadow:0 0 0 3px var(--gold), 0 10px 30px rgba(232,200,118,0.4);}
  .card.can-attack{box-shadow:0 0 0 2px rgba(232,200,118,0.45);}
  .card.sick{filter:grayscale(0.5) brightness(0.7);}
  .card.attacked{filter:grayscale(0.35) brightness(0.75);}
  .card.disabled{filter:grayscale(0.6) brightness(0.55);}
  .card.targetable{box-shadow:0 0 0 3px var(--danger), 0 0 18px rgba(255,111,125,0.5);}
  .card.mini{aspect-ratio:5/7;}
  .card.mini .name{font-size:0.62rem;}
  .card.mini .gem{width:19px; height:19px; font-size:0.65rem;}

  .card-check{
    position:absolute; top:5px; right:5px; z-index:3; width:20px; height:20px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.6); background:rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center; font-size:0.7rem; color:#fff;
  }
  .card.selected-deck{outline:2px solid var(--accent-2); outline-offset:2px;}
  .card.selected-deck .card-check{background:var(--accent-2); color:#032; border-color:var(--accent-2);}

  .detail-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--panel); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:16px 18px 20px; transform:translateY(110%);
    transition:transform .28s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 -10px 40px rgba(0,0,0,0.5);
    max-height:46%;
  }
  .detail-sheet.open{transform:translateY(0);}
  .detail-row{display:flex; gap:14px; align-items:center;}
  .detail-art{width:78px; height:110px; border-radius:10px; overflow:hidden; flex-shrink:0; border:1px solid var(--line);}
  .detail-art svg, .detail-art img{width:100%; height:100%; object-fit:cover;}
  .detail-info h3{font-size:1.05rem; color:#fff;}
  .detail-stats{display:flex; gap:10px; margin:4px 0 6px; font-weight:700; font-size:0.85rem; flex-wrap:wrap;}
  .detail-stats span{padding:2px 9px; border-radius:8px; background:var(--panel-2);}
  .detail-text{font-family:'Cormorant Garamond',serif; font-size:0.95rem; color:var(--ink-dim); font-style:italic; line-height:1.3;}
  .detail-close{position:absolute; top:10px; right:14px; color:var(--ink-dim); font-size:1.3rem; background:none;}

  /* ---------- GAME ---------- */
  #screen-game{height:100%;}
  .hud{display:flex; align-items:center; justify-content:space-between; padding:8px 14px; border-bottom:1px solid var(--line-soft);}
  .hud .turn-pill{font-weight:700; font-size:0.8rem; padding:5px 12px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line);}
  .energy{display:flex; gap:3px; flex-wrap:wrap; max-width:110px;}
  .energy .pip{width:8px; height:8px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line);}
  .energy .pip.on{background:var(--gold); box-shadow:0 0 6px rgba(232,200,118,0.8);}

  .board{flex:1; display:flex; flex-direction:column; padding:6px 10px; gap:4px; min-height:0;}

  .hero-row{display:flex; align-items:center; justify-content:space-between; padding:4px 6px;}
  .hero-row .hero-info{display:flex; align-items:center; gap:8px;}
  .hero-portrait{
    width:44px; height:44px; border-radius:50%; flex-shrink:0; cursor:default;
    background:radial-gradient(circle at 35% 30%, #cfc4ff, #6a55d6 45%, #241a54 85%);
    border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel Decorative',serif; font-size:0.7rem; color:#fff;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .hero-portrait.enemy.targetable{box-shadow:0 0 0 3px var(--danger), 0 0 20px rgba(255,111,125,0.6); cursor:pointer; transform:scale(1.06);}
  .hero-health{font-weight:800; font-size:1.05rem; color:var(--ink);}
  .hero-health.low{color:var(--danger);}
  .hero-name{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.72rem; color:var(--ink-dim);}
  .hero-power-btn{
    padding:8px 12px; border-radius:12px; font-size:0.72rem; font-weight:700;
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
  }
  .hero-power-btn.ready{background:linear-gradient(135deg, var(--accent-2), #33a189); color:#022; box-shadow:0 4px 14px rgba(94,230,201,0.35);}
  .hero-power-btn:disabled{opacity:0.35;}

  .board-row{
    flex:1; display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap;
    padding:4px 2px; border-radius:14px; min-height:0; transition:background .15s ease, box-shadow .15s ease;
  }
  .board-row.drop-target{background:rgba(94,230,201,0.07); box-shadow:inset 0 0 0 2px var(--accent-2);}
  .board-divider{height:1px; background:var(--line-soft); margin:2px 8px;}
  .board-slot{width:62px; aspect-ratio:5/7; flex-shrink:0;}
  .board-slot .card{width:100%; height:100%; animation:playpop .28s cubic-bezier(.2,.9,.3,1); cursor:pointer;}
  @keyframes playpop{from{opacity:0; transform:scale(0.4) translateY(10px);} to{opacity:1; transform:scale(1) translateY(0);}}
  .board-empty-hint{font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--ink-dim); font-size:0.72rem; opacity:0.6;}

  .selected-panel{
    display:flex; align-items:center; gap:10px; padding:8px 12px; margin:0 8px; border-radius:14px;
    background:var(--panel); border:1px solid var(--line); min-height:0;
  }
  .selected-panel.hidden{display:none;}
  .selected-panel .sp-art{width:40px; height:56px; border-radius:8px; overflow:hidden; flex-shrink:0; border:1px solid var(--line);}
  .selected-panel .sp-art svg, .selected-panel .sp-art img{width:100%;height:100%; object-fit:cover;}
  .selected-panel .sp-text{flex:1; min-width:0;}
  .selected-panel .sp-name{font-weight:700; font-size:0.85rem; color:#fff;}
  .selected-panel .sp-desc{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.78rem; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .selected-panel .sp-hint{font-size:0.66rem; color:var(--accent-2); font-weight:600; flex-shrink:0; text-align:right;}

  .hand-bar{display:flex; align-items:flex-end; gap:10px; padding:8px 14px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--line-soft);}
  .hand-scroll{flex:1; display:flex; gap:8px; overflow-x:auto; padding:6px 2px 2px; -webkit-overflow-scrolling:touch;}
  .hand-scroll .card{width:60px; flex-shrink:0; cursor:pointer; touch-action:pan-x;}
  .hand-scroll .card.dragging{opacity:0.35;}
  .drag-ghost{position:fixed !important; z-index:1000 !important; pointer-events:none !important; margin:0 !important; transform:none !important; opacity:0.92 !important; box-shadow:0 14px 36px rgba(0,0,0,0.55), 0 0 0 2px var(--accent-2) !important;}
  .deck-pill{flex-shrink:0; text-align:center; color:var(--ink-dim); font-size:0.62rem; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .deck-pill .num{font-weight:800; font-size:0.95rem; color:var(--ink);}
  .end-turn-btn{flex-shrink:0; padding:13px 16px; border-radius:14px; font-weight:700; font-size:0.82rem;
    background:linear-gradient(135deg, var(--accent-2), #33a189); color:#022; box-shadow:0 6px 20px rgba(94,230,201,0.3);}
  .end-turn-btn:disabled{opacity:0.4;}

  .ai-thinking{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:30;
    background:var(--panel); border:1px solid var(--line); padding:10px 20px; border-radius:20px; font-size:0.85rem; color:var(--ink-dim);
    opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .ai-thinking.show{opacity:1;}

  /* ---------- RESULT ---------- */
  #screen-result{align-items:center; justify-content:center; text-align:center; padding:20px; gap:14px;}
  .result-title{font-size:2.1rem; font-weight:900;}
  .result-title.win{color:var(--accent-2); text-shadow:0 0 40px rgba(94,230,201,0.5);}
  .result-title.lose{color:var(--danger); text-shadow:0 0 40px rgba(255,111,125,0.4);}
  .result-title.draw{color:var(--gold);}
  .result-lanes{display:flex; gap:14px; margin:8px 0;}
  .result-lane{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px 16px; min-width:90px;}
  .result-lane .rl-name{font-size:0.65rem; color:var(--ink-dim); font-family:'Cormorant Garamond',serif; font-style:italic;}
  .result-lane .rl-score{font-weight:800; font-size:1.3rem; margin-top:4px;}
  .result-lane.won{border-color:var(--accent-2);}
  .result-lane.lost{border-color:var(--danger);}
  .result-btns{display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px; margin-top:6px;}

  #toast{position:fixed; top:12px; left:50%; transform:translateX(-50%) translateY(-140%); z-index:60;
    background:var(--panel); border:1px solid var(--accent); padding:8px 16px; border-radius:20px;
    font-size:0.78rem; color:var(--ink); transition:transform .3s ease; white-space:nowrap; box-shadow:0 8px 24px rgba(0,0,0,0.5);}
  #toast.show{transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:0; height:0;}
</style>
<body>

<div id="stars"></div>
<div id="toast"></div>

<div id="app">

  <!-- MENU -->
  <div class="screen active" id="screen-menu">
    <div class="menu-orb"></div>
    <h1 class="menu-title">NEBULOSA</h1>
    <div class="menu-tag">Summon your creatures. Swing for the throne. Bring your foe's 30 Health to 0.</div>
    <div class="menu-btns">
      <button class="btn btn-primary" id="btn-build">Build your deck</button>
      <button class="btn btn-ghost" id="btn-quick">Quick start (random deck)</button>
      <button class="btn btn-ghost" id="btn-howto">How to play</button>
    </div>
    <div class="menu-footer">nebulosa · a card drift</div>
  </div>

  <!-- DECKBUILDER -->
  <div class="screen" id="screen-deck">
    <div class="deck-header">
      <h2>Choose your 12</h2>
      <div class="deck-count" id="deck-count">0 / 12</div>
    </div>
    <div class="deck-grid" id="deck-grid"></div>
    <div class="deck-footer">
      <button class="btn btn-ghost" id="btn-back-menu">Back</button>
      <button class="btn btn-ghost" id="btn-random-deck">Random</button>
      <button class="btn btn-primary" id="btn-start-battle" disabled>Enter the rift</button>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div class="hud">
      <div class="turn-pill" id="turn-pill">Your turn</div>
      <div class="energy" id="energy-pips"></div>
    </div>
    <div class="board">
      <div class="hero-row">
        <div class="hero-info">
          <div class="hero-portrait enemy" id="enemy-hero"></div>
          <div>
            <div class="hero-name">Opponent</div>
            <div class="hero-health" id="enemy-health">30</div>
          </div>
        </div>
      </div>
      <div class="board-row" id="enemy-board"></div>
      <div class="board-divider"></div>
      <div class="board-row" id="player-board"></div>
      <div class="hero-row">
        <div class="hero-info">
          <div class="hero-portrait" id="player-hero"></div>
          <div>
            <div class="hero-name">You</div>
            <div class="hero-health" id="player-health">30</div>
          </div>
        </div>
        <button class="hero-power-btn" id="btn-hero-power">Ember Pulse<br>2 mana</button>
      </div>
      <div class="selected-panel hidden" id="selected-panel">
        <div class="sp-art" id="sp-art"></div>
        <div class="sp-text">
          <div class="sp-name" id="sp-name"></div>
          <div class="sp-desc" id="sp-desc"></div>
        </div>
        <div class="sp-hint" id="sp-hint">Tap your board to play</div>
      </div>
    </div>
    <div class="hand-bar">
      <div class="deck-pill"><div class="num" id="deck-num">8</div>deck</div>
      <div class="hand-scroll" id="hand-scroll"></div>
      <button class="end-turn-btn" id="btn-end-turn">End turn</button>
    </div>
    <div class="ai-thinking" id="ai-thinking">Opponent is plotting…</div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="result-title" id="result-title">You win</div>
    <div class="serif" id="result-sub" style="color:var(--ink-dim); font-style:italic; font-size:1.05rem;"></div>
    <div class="result-lanes" id="result-lanes"></div>
    <div class="result-btns">
      <button class="btn btn-primary" id="btn-rematch">Rematch</button>
      <button class="btn btn-ghost" id="btn-redeck">Change deck</button>
      <button class="btn btn-ghost" id="btn-menu2">Main menu</button>
    </div>
  </div>

</div>

<!-- Detail sheet (deckbuilder card info) -->
<div class="detail-sheet" id="detail-sheet">
  <button class="detail-close" id="detail-close">×</button>
  <div class="detail-row">
    <div class="detail-art" id="detail-art"></div>
    <div class="detail-info">
      <h3 id="detail-name">Card</h3>
      <div class="detail-stats"><span id="detail-cost">Cost 1</span><span id="detail-atk">Attack 1</span><span id="detail-hp">Health 1</span></div>
      <div class="detail-text" id="detail-text">Flavor text.</div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= STARFIELD ================= */
(function starfield(){
  const container = document.getElementById('stars');
  function makeLayer(count, size, opacity, speed){
    const layer = document.createElement('div');
    layer.className='layer';
    let shadows=[];
    for(let i=0;i<count;i++){
      const x=Math.random()*100, y=Math.random()*100;
      shadows.push(`${x}vw ${y}vh 0 ${Math.random()*opacity}px rgba(255,255,255,${(0.4+Math.random()*0.6).toFixed(2)})`);
    }
    layer.style.width=size+'px'; layer.style.height=size+'px';
    layer.style.boxShadow=shadows.join(',');
    layer.style.background='transparent';
    layer.style.borderRadius='50%';
    layer.style.animation=`twinkle ${speed}s ease-in-out infinite`;
    return layer;
  }
  const style=document.createElement('style');
  style.textContent='@keyframes twinkle{0%,100%{opacity:.7}50%{opacity:1}}';
  document.head.appendChild(style);
  container.appendChild(makeLayer(70,1,1,4));
  container.appendChild(makeLayer(40,2,1.4,6));
})();

/* ================= UTIL ================= */
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=Math.imul(31,h)+s.charCodeAt(i)|0;}return h;}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rand){
  rand = rand || Math.random;
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function catmullRom2bezier(pts){
  const n = pts.length;
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} `;
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d += `C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)} `;
  }
  return d + 'Z';
}
function blotPath(rand, cx, cy, baseR, points){
  const half=[];
  for(let i=0;i<=points;i++){
    const angle = Math.PI * i/points;
    const r = baseR*(0.5+rand()*0.6);
    half.push([cx+Math.sin(angle)*r, cy-Math.cos(angle)*r]);
  }
  const left = half.slice(1,-1).reverse().map(([x,y])=>[cx-(x-cx),y]);
  return catmullRom2bezier([...half,...left]);
}
const artCache = {};
function generateArt(card){
  if(artCache[card.id]) return artCache[card.id];
  const rand = mulberry32(hashStr(card.id+'::nebulosa'));
  const hue = card.hue;
  const hue2 = (hue+25+Math.floor(rand()*35))%360;
  const hue3 = (hue-45+360)%360;
  const blot1 = blotPath(rand, 100, 88, 50+rand()*18, 7+Math.floor(rand()*3));
  const blot2 = blotPath(rand, 100, 100, 26+rand()*12, 6);
  let stars='';
  const n = 6+Math.floor(rand()*7);
  for(let i=0;i<n;i++){
    const sx=(rand()*200).toFixed(1), sy=(rand()*150).toFixed(1), sr=(rand()*1.1+0.35).toFixed(2);
    stars += `<circle cx="${sx}" cy="${sy}" r="${sr}" fill="#fff" opacity="${(rand()*0.5+0.35).toFixed(2)}"/>`;
  }
  const svg = `<svg viewBox="0 0 200 160" class="card-art" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bg-${card.id}" cx="50%" cy="30%" r="80%">
        <stop offset="0%" stop-color="hsl(${hue2} 75% 60%)"/>
        <stop offset="55%" stop-color="hsl(${hue} 60% 30%)"/>
        <stop offset="100%" stop-color="hsl(${hue3} 65% 10%)"/>
      </radialGradient>
      <radialGradient id="bl-${card.id}" cx="42%" cy="32%" r="75%">
        <stop offset="0%" stop-color="hsl(${hue2} 88% 74%)"/>
        <stop offset="100%" stop-color="hsl(${hue} 75% 38%)"/>
      </radialGradient>
      <filter id="fb-${card.id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2"/></filter>
    </defs>
    <rect width="200" height="160" fill="url(#bg-${card.id})"/>
    ${stars}
    <path d="${blot1}" fill="url(#bl-${card.id})" opacity="0.92" filter="url(#fb-${card.id})"/>
    <path d="${blot2}" fill="hsl(${hue3} 55% 18%)" opacity="0.5"/>
    <path d="${blot1}" fill="none" stroke="hsl(${hue2} 90% 88%)" stroke-width="1" opacity="0.45"/>
  </svg>`;
  artCache[card.id]=svg;
  return svg;
}

/* ================= ABILITIES ================= */
function friendlyBoard(g,owner){ return owner==='player'?g.playerBoard:g.aiBoard; }
function enemyBoard(g,owner){ return owner==='player'?g.aiBoard:g.playerBoard; }
function buff(m,atk,hp){ m.atk+=atk; m.curHp+=hp; m.hp+=hp; }
function cleanupBoard(g){
  g.playerBoard = g.playerBoard.filter(m=>m.curHp>0);
  g.aiBoard = g.aiBoard.filter(m=>m.curHp>0);
}

const ABILITIES = {
  glowsnail: (ctx)=>{ drawCard(ctx.game, ctx.owner); },
  cinderfox: (ctx)=>{
    const allies = friendlyBoard(ctx.game, ctx.owner).filter(m=>m.uid!==ctx.minion.uid);
    ctx.minion.atk += allies.length;
  },
  voidling: (ctx)=>{
    const enemies = enemyBoard(ctx.game, ctx.owner);
    if(enemies.length){
      const weakest = enemies.reduce((a,b)=> a.curHp<=b.curHp?a:b);
      weakest.curHp -= 2;
    }
  },
  starling: (ctx)=>{
    const allies = friendlyBoard(ctx.game, ctx.owner).filter(m=>m.uid!==ctx.minion.uid);
    if(allies.length){
      const target = allies[Math.floor(Math.random()*allies.length)];
      buff(target,1,1);
    }
  },
  umbral: (ctx)=>{
    const allies = friendlyBoard(ctx.game, ctx.owner);
    if(allies.length>=4) drawCard(ctx.game, ctx.owner);
  },
  duneshaper: (ctx)=>{
    const allies = friendlyBoard(ctx.game, ctx.owner);
    if(allies.length>=4) buff(ctx.minion,2,2);
  },
  gravemoth: (ctx)=>{
    const owner = ctx.owner, game = ctx.game;
    const allies = friendlyBoard(game, owner).filter(m=>m.uid!==ctx.minion.uid);
    if(allies.length){
      const weakest = allies.reduce((a,b)=> (a.atk+a.curHp)<=(b.atk+b.curHp)?a:b);
      const board = friendlyBoard(game, owner);
      const idx = board.findIndex(m=>m.uid===weakest.uid);
      if(idx!==-1) board.splice(idx,1);
      buff(ctx.minion, weakest.atk+1, weakest.curHp+1);
    }
  },
  wyrmglass: (ctx)=>{
    if(ctx.owner==='player') ctx.game.playerHealth = Math.min(30, ctx.game.playerHealth+4);
    else ctx.game.aiHealth = Math.min(30, ctx.game.aiHealth+4);
  },
  hollowking: (ctx)=>{
    enemyBoard(ctx.game, ctx.owner).forEach(m=>{ m.curHp -= 2; });
  },
  nullshade: (ctx)=>{
    const enemies = enemyBoard(ctx.game, ctx.owner).filter(m=>m.curHp<=4);
    if(enemies.length){
      const target = enemies.reduce((a,b)=> a.curHp<=b.curHp?a:b);
      target.curHp = 0;
    }
  },
  huskseer: (ctx)=>{
    const handLen = (ctx.owner==='player' ? ctx.game.playerHand : ctx.game.aiHand).length;
    buff(ctx.minion, handLen, handLen);
  },

    const enemies = enemyBoard(ctx.game, ctx.owner);
    if(enemies.length){
      const weakest = enemies.reduce((a,b)=> a.curHp<=b.curHp?a:b);
      weakest.curHp -= 2;
      ctx.minion.atk += 2;
    }
  },
  cindertrooper: (ctx)=>{
    enemyBoard(ctx.game, ctx.owner).forEach(m=>{ m.curHp -= 1; });
  },
  deepfang: (ctx)=>{
    const enemies = enemyBoard(ctx.game, ctx.owner);
    if(enemies.length){
      const weakest = enemies.reduce((a,b)=> a.curHp<=b.curHp?a:b);
      weakest.curHp = 0;
    }
  },
};

function resolveBattlecry(minion, owner, game){
  if(!minion.ability) return;
  const fn = ABILITIES[minion.ability];
  if(fn) fn({minion, owner, game});
}

/* ================= GAME STATE ================= */
let UID = 1;
function createInstance(defId, owner){
  const def = CARD_BY_ID[defId];
  return {uid:UID++, defId, name:def.name, cost:def.cost, atk:def.atk, hp:def.hp, hue:def.hue, tier:def.tier, owner, text:def.text, ability:def.ability, taunt:def.taunt, img:def.img};
}
function toMinion(card, owner){
  return Object.assign({}, card, {owner, curHp:card.hp, sick:true, hasAttacked:false});
}
function shuffle(arr, rand){
  rand = rand || Math.random;
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function buildDeck(ids, owner){ return shuffle(ids.map(id=>createInstance(id, owner))); }
function drawCard(game, owner){
  const deck = owner==='player'?game.playerDeck:game.aiDeck;
  const hand = owner==='player'?game.playerHand:game.aiHand;
  if(deck.length && hand.length<10) hand.push(deck.shift());
}
function resetSickness(board){ board.forEach(m=>{ m.sick=false; m.hasAttacked=false; }); }

let game = null;

function newGame(playerIds){
  const allIds = CARD_POOL.map(c=>c.id);
  const aiIds = shuffle(allIds).slice(0,12);
  game = {
    playerTurnNum:0, aiTurnNum:0,
    playerMana:0, aiMana:0,
    playerHealth:30, aiHealth:30,
    playerHeroPowerUsed:false, aiHeroPowerUsed:false,
    playerBoard:[], aiBoard:[],
    playerHand:[], aiHand:[],
    playerDeck: buildDeck(playerIds,'player'),
    aiDeck: buildDeck(aiIds,'ai'),
    over:false,
    selectedUid:null,
    selectedAttackerUid:null,
  };
  for(let i=0;i<3;i++){ drawCard(game,'player'); drawCard(game,'ai'); }
  startPlayerTurn();
}

function startPlayerTurn(){
  if(game.over) return;
  game.playerTurnNum++;
  game.playerMana = Math.min(game.playerTurnNum,10);
  game.playerHeroPowerUsed = false;
  drawCard(game,'player');
  resetSickness(game.playerBoard);
  game.selectedUid = null;
  game.selectedAttackerUid = null;
  renderGame();
}

function checkGameOver(){
  if(game.playerHealth<=0 || game.aiHealth<=0){
    game.over = true;
  }
}

function playCard(uid){
  const idx = game.playerHand.findIndex(c=>c.uid===uid);
  if(idx===-1) return;
  const card = game.playerHand[idx];
  if(card.cost > game.playerMana){ toast('Not enough mana'); return; }
  if(game.playerBoard.length>=7){ toast('Your board is full'); return; }
  game.playerHand.splice(idx,1);
  const minion = toMinion(card,'player');
  game.playerBoard.push(minion);
  game.playerMana -= card.cost;
  game.selectedUid = null;
  resolveBattlecry(minion,'player',game);
  cleanupBoard(game);
  checkGameOver();
  if(game.over){ endGame(); return; }
  renderGame();
}

let dragState = null;
let suppressNextClick = false;

function startCardDrag(e, card, el){
  if(e.pointerType==='mouse' && e.button!==0) return;
  if(card.cost > game.playerMana || game.playerBoard.length>=7 || game.over) return;

  dragState = {
    card,
    el,
    pointerId:e.pointerId,
    startX:e.clientX,
    startY:e.clientY,
    dragging:false,
    ghost:null
  };
  el.setPointerCapture?.(e.pointerId);
}

function updateCardDrag(e){
  if(!dragState || e.pointerId!==dragState.pointerId) return;
  const dx=e.clientX-dragState.startX;
  const dy=e.clientY-dragState.startY;

  if(!dragState.dragging){
    if(Math.hypot(dx,dy)<8) return;
    dragState.dragging=true;
    suppressNextClick=true;

    const ghost=dragState.el.cloneNode(true);
    ghost.classList.remove('selected');
    ghost.classList.add('drag-ghost');
    ghost.style.width=dragState.el.getBoundingClientRect().width+'px';
    ghost.style.height=dragState.el.getBoundingClientRect().height+'px';
    document.body.appendChild(ghost);
    dragState.ghost=ghost;
    dragState.el.classList.add('dragging');
    document.getElementById('player-board').classList.add('drop-target');
  }

  const ghost=dragState.ghost;
  if(!ghost) return;
  ghost.style.left=(e.clientX-ghost.offsetWidth/2)+'px';
  ghost.style.top=(e.clientY-ghost.offsetHeight/2)+'px';

  const board=document.getElementById('player-board');
  const r=board.getBoundingClientRect();
  const overBoard=e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
  board.classList.toggle('drop-target', overBoard);
}

function endCardDrag(e){
  if(!dragState || e.pointerId!==dragState.pointerId) return;
  const state=dragState;
  dragState=null;

  if(!state.dragging) return;

  const board=document.getElementById('player-board');
  const r=board.getBoundingClientRect();
  const overBoard=e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;

  state.ghost?.remove();
  state.el.classList.remove('dragging');
  board.classList.toggle('drop-target', !!game.playerHand.find(c=>c.uid===game.selectedUid));

  if(overBoard){
    playCard(state.card.uid);
  }
}

window.addEventListener('pointermove', updateCardDrag);
window.addEventListener('pointerup', endCardDrag);
window.addEventListener('pointercancel', endCardDrag);

function selectAttacker(uid){
  const m = game.playerBoard.find(x=>x.uid===uid);
  if(!m || m.sick || m.hasAttacked) return;
  game.selectedAttackerUid = (game.selectedAttackerUid===uid) ? null : uid;
  game.selectedUid = null;
  renderGame();
}

function playerAttack(targetType, targetUid){
  const attacker = game.playerBoard.find(m=>m.uid===game.selectedAttackerUid);
  if(!attacker) return;
  const enemyTaunts = game.aiBoard.filter(m=>m.taunt);
  if(targetType==='hero'){
    if(enemyTaunts.length) { toast("Must attack a Taunt minion first"); return; }
    game.aiHealth -= attacker.atk;
  } else {
    const target = game.aiBoard.find(m=>m.uid===targetUid);
    if(!target) return;
    if(enemyTaunts.length && !target.taunt){ toast("Must attack a Taunt minion first"); return; }
    target.curHp -= attacker.atk;
    attacker.curHp -= target.atk;
  }
  attacker.hasAttacked = true;
  game.selectedAttackerUid = null;
  cleanupBoard(game);
  checkGameOver();
  if(game.over){ endGame(); return; }
  renderGame();
}

function useHeroPower(){
  if(game.over) return;
  if(game.playerMana<2){ toast('Not enough mana'); return; }
  if(game.playerHeroPowerUsed){ toast('Already used this turn'); return; }
  game.playerMana -= 2;
  game.playerHeroPowerUsed = true;
  game.aiHealth -= 1;
  checkGameOver();
  if(game.over){ endGame(); return; }
  renderGame();
}

function aiTakeTurn(){
  let guard = 0;
  while(guard++ < 20){
    const playable = game.aiHand.filter(c=>c.cost<=game.aiMana);
    if(!playable.length || game.aiBoard.length>=7) break;
    if(Math.random()<0.15) break;
    const pick = playable[Math.floor(Math.random()*playable.length)];
    const idx = game.aiHand.findIndex(c=>c.uid===pick.uid);
    game.aiHand.splice(idx,1);
    const minion = toMinion(pick,'ai');
    game.aiBoard.push(minion);
    game.aiMana -= pick.cost;
    resolveBattlecry(minion,'ai',game);
    cleanupBoard(game);
    checkGameOver();
    if(game.over) return;
  }
  if(game.aiMana>=2 && !game.aiHeroPowerUsed){
    game.aiMana -= 2;
    game.aiHeroPowerUsed = true;
    game.playerHealth -= 1;
    checkGameOver();
    if(game.over) return;
  }
  const attackers = game.aiBoard.filter(m=>!m.sick && !m.hasAttacked);
  for(const attacker of attackers){
    if(game.over) return;
    const stillAlive = game.aiBoard.find(m=>m.uid===attacker.uid);
    if(!stillAlive || stillAlive.curHp<=0) continue;
    const playerTaunts = game.playerBoard.filter(m=>m.taunt);
    if(playerTaunts.length){
      const target = playerTaunts[Math.floor(Math.random()*playerTaunts.length)];
      target.curHp -= stillAlive.atk;
      stillAlive.curHp -= target.atk;
    } else if(game.playerBoard.length && Math.random()<0.6){
      const target = game.playerBoard[Math.floor(Math.random()*game.playerBoard.length)];
      target.curHp -= stillAlive.atk;
      stillAlive.curHp -= target.atk;
    } else {
      game.playerHealth -= stillAlive.atk;
    }
    stillAlive.hasAttacked = true;
    cleanupBoard(game);
    checkGameOver();
  }
}

function endTurn(){
  if(game.over) return;
  document.getElementById('btn-end-turn').disabled = true;
  const aiThinking = document.getElementById('ai-thinking');
  aiThinking.classList.add('show');
  setTimeout(()=>{
    game.aiTurnNum++;
    game.aiMana = Math.min(game.aiTurnNum,10);
    game.aiHeroPowerUsed = false;
    drawCard(game,'ai');
    resetSickness(game.aiBoard);
    aiTakeTurn();
    renderGame();
    aiThinking.classList.remove('show');
    if(game.over){ setTimeout(endGame, 500); return; }
    setTimeout(()=>{ startPlayerTurn(); document.getElementById('btn-end-turn').disabled=false; }, 500);
  }, 700);
}

function endGame(){
  let outcome;
  if(game.aiHealth<=0 && game.playerHealth<=0) outcome='draw';
  else if(game.aiHealth<=0) outcome='win';
  else outcome='lose';
  showResult(outcome);
}

/* ================= RENDER: STATIC HELPERS ================= */
function cardArt(card){
  if(card.img) return `<img class="card-art" src="${card.img}" alt="${card.name}">`;
  return generateArt(card);
}
function cardEl(card, opts){
  opts = opts || {};
  const div = document.createElement('div');
  div.className = 'card tier-'+card.tier + (opts.mini?' mini':'');
  if(opts.extraClass) div.classList.add(opts.extraClass);
  div.innerHTML = cardArt(card) + '<div class="card-shade"></div>'
    + `<div class="gem cost">${card.cost}</div>`
    + `<div class="gem atk">${card.atk}</div>`
    + `<div class="gem hp">${opts.curHp!=null?opts.curHp:card.hp}</div>`
    + (card.taunt ? `<div class="taunt-badge">T</div>` : '')
    + (opts.showName!==false ? `<div class="name">${card.name}</div>` : '');
  return div;
}

/* ================= DECKBUILDER ================= */
let deckSelection = new Set();
function renderDeckBuilder(){
  const grid = document.getElementById('deck-grid');
  grid.innerHTML='';
  CARD_POOL.forEach(def=>{
    const wrap = document.createElement('div');
    wrap.style.position='relative';
    const el = cardEl(def, {mini:true});
    if(deckSelection.has(def.id)) el.classList.add('selected-deck');
    const check = document.createElement('div');
    check.className='card-check';
    check.textContent = deckSelection.has(def.id) ? '✓' : '';
    el.appendChild(check);
    el.addEventListener('click', ()=>{ openDetail(def); });
    wrap.appendChild(el);
    const toggleBtn = document.createElement('button');
    toggleBtn.textContent = deckSelection.has(def.id) ? 'Remove' : 'Add';
    toggleBtn.style.cssText='margin-top:4px;width:100%;padding:5px;border-radius:8px;font-size:0.68rem;font-weight:700;background:'+(deckSelection.has(def.id)?'rgba(255,111,125,0.18)':'rgba(94,230,201,0.15)')+';color:'+(deckSelection.has(def.id)?'var(--danger)':'var(--accent-2)')+';border:1px solid var(--line);';
    toggleBtn.addEventListener('click',(e)=>{ e.stopPropagation(); toggleDeckCard(def.id); });
    wrap.appendChild(toggleBtn);
    grid.appendChild(wrap);
  });
  updateDeckCount();
}
function toggleDeckCard(id){
  if(deckSelection.has(id)) deckSelection.delete(id);
  else{
    if(deckSelection.size>=12) return;
    deckSelection.add(id);
  }
  renderDeckBuilder();
}
function updateDeckCount(){
  const el = document.getElementById('deck-count');
  el.textContent = deckSelection.size + ' / 12';
  el.classList.toggle('full', deckSelection.size===12);
  document.getElementById('btn-start-battle').disabled = deckSelection.size!==12;
}
function openDetail(def){
  document.getElementById('detail-art').innerHTML = cardArt(def);
  document.getElementById('detail-name').textContent = def.name;
  document.getElementById('detail-cost').textContent = 'Cost '+def.cost;
  document.getElementById('detail-atk').textContent = 'Attack '+def.atk;
  document.getElementById('detail-hp').textContent = 'Health '+def.hp;
  document.getElementById('detail-text').textContent = def.text;
  document.getElementById('detail-sheet').classList.add('open');
}
document.getElementById('detail-close').addEventListener('click', ()=>{
  document.getElementById('detail-sheet').classList.remove('open');
});

/* ================= GAME RENDER ================= */
function renderGame(){
  document.getElementById('turn-pill').textContent = game.over ? 'Game over' : 'Your turn';
  const pipsEl = document.getElementById('energy-pips');
  pipsEl.innerHTML='';
  for(let i=1;i<=10;i++){
    const pip=document.createElement('div');
    pip.className='pip'+(i<=game.playerMana?' on':'');
    pipsEl.appendChild(pip);
  }
  document.getElementById('deck-num').textContent = game.playerDeck.length;

  const playerHealthEl = document.getElementById('player-health');
  const enemyHealthEl = document.getElementById('enemy-health');
  playerHealthEl.textContent = Math.max(0, game.playerHealth);
  enemyHealthEl.textContent = Math.max(0, game.aiHealth);
  playerHealthEl.classList.toggle('low', game.playerHealth<=10);
  enemyHealthEl.classList.toggle('low', game.aiHealth<=10);

  const selectedHandCard = game.playerHand.find(c=>c.uid===game.selectedUid);
  const attacker = game.playerBoard.find(m=>m.uid===game.selectedAttackerUid);

  const enemyHeroEl = document.getElementById('enemy-hero');
  enemyHeroEl.textContent = 'AI';
  enemyHeroEl.classList.toggle('targetable', !!attacker);
  enemyHeroEl.onclick = ()=>{ if(attacker) playerAttack('hero'); };

  const playerHeroEl = document.getElementById('player-hero');
  playerHeroEl.textContent = 'You';

  const heroPowerBtn = document.getElementById('btn-hero-power');
  const canPower = game.playerMana>=2 && !game.playerHeroPowerUsed && !game.over;
  heroPowerBtn.disabled = !canPower;
  heroPowerBtn.classList.toggle('ready', canPower);
  heroPowerBtn.onclick = useHeroPower;

  const enemyBoardEl = document.getElementById('enemy-board');
  enemyBoardEl.innerHTML = '';
  if(!game.aiBoard.length){
    const hint = document.createElement('div');
    hint.className='board-empty-hint';
    hint.textContent = "Opponent's board is empty";
    enemyBoardEl.appendChild(hint);
  }
  game.aiBoard.forEach(m=>{
    const slot = document.createElement('div'); slot.className='board-slot';
    const el = cardEl(m, {mini:true, curHp:m.curHp, showName:false});
    const enemyTaunts = game.aiBoard.filter(x=>x.taunt);
    const canTarget = attacker && (!enemyTaunts.length || m.taunt);
    if(canTarget) el.classList.add('targetable');
    el.addEventListener('click', ()=>{ if(attacker) playerAttack('minion', m.uid); });
    slot.appendChild(el);
    enemyBoardEl.appendChild(slot);
  });

  const playerBoardEl = document.getElementById('player-board');
  playerBoardEl.innerHTML = '';
  playerBoardEl.classList.toggle('drop-target', !!selectedHandCard);
  if(!game.playerBoard.length){
    const hint = document.createElement('div');
    hint.className='board-empty-hint';
    hint.textContent = 'Your board is empty';
    playerBoardEl.appendChild(hint);
  }
  game.playerBoard.forEach(m=>{
    const slot = document.createElement('div'); slot.className='board-slot';
    const canAttack = !m.sick && !m.hasAttacked;
    const el = cardEl(m, {mini:true, curHp:m.curHp, showName:false});
    if(m.uid===game.selectedAttackerUid) el.classList.add('attacker-selected');
    else if(canAttack) el.classList.add('can-attack');
    if(m.sick) el.classList.add('sick');
    if(m.hasAttacked) el.classList.add('attacked');
    slot.appendChild(el);
    slot.addEventListener('click', ()=>{
      if(selectedHandCard){ playCard(selectedHandCard.uid); return; }
      selectAttacker(m.uid);
    });
    playerBoardEl.appendChild(slot);
  });
  playerBoardEl.addEventListener('click', function boardClickOnce(e){
    if(e.target===playerBoardEl && selectedHandCard) playCard(selectedHandCard.uid);
  }, {once:true});

  const handScroll = document.getElementById('hand-scroll');
  handScroll.innerHTML='';
  game.playerHand.forEach(c=>{
    const el = cardEl(c);
    const affordable = c.cost<=game.playerMana;
    if(!affordable) el.classList.add('disabled');
    if(c.uid===game.selectedUid) el.classList.add('selected');
    el.addEventListener('pointerdown', (e)=> startCardDrag(e, c, el));
    el.addEventListener('click', (e)=>{
      if(suppressNextClick){
        suppressNextClick=false;
        return;
      }
      if(!affordable){ toast("Not enough mana"); return; }
      game.selectedUid = (game.selectedUid===c.uid) ? null : c.uid;
      game.selectedAttackerUid = null;
      renderGame();
    });
    handScroll.appendChild(el);
  });

  const panel = document.getElementById('selected-panel');
  if(selectedHandCard){
    panel.classList.remove('hidden');
    document.getElementById('sp-art').innerHTML = cardArt(selectedHandCard);
    document.getElementById('sp-name').textContent = selectedHandCard.name+' · '+selectedHandCard.cost+'⚡ '+selectedHandCard.atk+'/'+selectedHandCard.hp;
    document.getElementById('sp-desc').textContent = selectedHandCard.text;
    document.getElementById('sp-hint').textContent = 'Tap your board to play';
  } else if(attacker){
    panel.classList.remove('hidden');
    document.getElementById('sp-art').innerHTML = cardArt(attacker);
    document.getElementById('sp-name').textContent = attacker.name+' · '+attacker.atk+'/'+attacker.curHp;
    document.getElementById('sp-desc').textContent = attacker.text;
    document.getElementById('sp-hint').textContent = 'Tap an enemy to attack';
  } else {
    panel.classList.add('hidden');
  }

  document.getElementById('btn-end-turn').disabled = !!game.over;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1500);
}

/* ================= RESULT ================= */
function showResult(outcome){
  const titleEl = document.getElementById('result-title');
  titleEl.className='result-title '+(outcome==='win'?'win':outcome==='lose'?'lose':'draw');
  titleEl.textContent = outcome==='win' ? 'You win the drift' : outcome==='lose' ? 'The rifts slip away' : 'A silent drift';
  document.getElementById('result-sub').textContent = `Final Health — You: ${Math.max(0,game.playerHealth)} · Opponent: ${Math.max(0,game.aiHealth)}`;
  const lanesEl = document.getElementById('result-lanes');
  lanesEl.innerHTML='';
  const you = document.createElement('div');
  you.className='result-lane '+(outcome==='win'?'won':outcome==='lose'?'lost':'');
  you.innerHTML = `<div class="rl-name">You</div><div class="rl-score">${Math.max(0,game.playerHealth)}</div>`;
  const them = document.createElement('div');
  them.className='result-lane '+(outcome==='lose'?'won':outcome==='win'?'lost':'');
  them.innerHTML = `<div class="rl-name">Opponent</div><div class="rl-score">${Math.max(0,game.aiHealth)}</div>`;
  lanesEl.appendChild(you);
  lanesEl.appendChild(them);
  showScreen('screen-result');
}

/* ================= SCREEN NAV ================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('btn-build').addEventListener('click', ()=>{
  showScreen('screen-deck');
  renderDeckBuilder();
});
document.getElementById('btn-back-menu').addEventListener('click', ()=> showScreen('screen-menu'));
document.getElementById('btn-random-deck').addEventListener('click', ()=>{
  deckSelection = new Set(shuffle(CARD_POOL.map(c=>c.id)).slice(0,12));
  renderDeckBuilder();
});
document.getElementById('btn-start-battle').addEventListener('click', ()=>{
  newGame(Array.from(deckSelection));
  showScreen('screen-game');
  renderGame();
});
document.getElementById('btn-quick').addEventListener('click', ()=>{
  const ids = shuffle(CARD_POOL.map(c=>c.id)).slice(0,12);
  newGame(ids);
  showScreen('screen-game');
  renderGame();
});
document.getElementById('btn-end-turn').addEventListener('click', endTurn);
document.getElementById('btn-rematch').addEventListener('click', ()=>{

  newGame(useIds);
  showScreen('screen-game');
  renderGame();
});
document.getElementById('btn-redeck').addEventListener('click', ()=>{
  showScreen('screen-deck');
  renderDeckBuilder();
});
document.getElementById('btn-menu2').addEventListener('click', ()=> showScreen('screen-menu'));

document.getElementById('btn-howto').addEventListener('click', ()=>{
  alert("NEBULOSA — how to play\n\n"
    +"• Each turn your mana crystals increase by 1, up to 10.\n"
    +"• Play creatures from your hand onto your board. A newly summoned creature can't attack until your next turn.\n"
    +"• Tap a ready creature to select it as an attacker, then tap an enemy creature or the enemy hero to attack. Taunt creatures must be attacked first.\n"
    +"• Many creatures have a Battlecry that triggers the moment they're played.\n"
    +"• Your Hero Power, Ember Pulse (2 mana, once per turn), deals 1 damage to the enemy hero.\n"
    +"• Bring the enemy's 30 Health to 0 to win the drift.");
});
